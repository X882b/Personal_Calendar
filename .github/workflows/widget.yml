# Builds the Android widget app. Every push that touches widget/ builds it;
# on main the APK is also published as a GitHub release, so a phone can
# download it from https://github.com/X882b/Personal_Calendar/releases/latest
name: Widget APK

on:
  push:
    paths:
      - "widget/**"
      - ".github/workflows/widget.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle -p widget assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp widget/app/build/outputs/apk/release/app-release.apk schedule-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: schedule-widget
          path: schedule-widget.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "widget-${{ github.run_number }}" schedule-widget.apk \
            --title "Schedule widget ${{ github.run_number }}" \
            --notes "On the phone: download schedule-widget.apk below and open it. A newer version installs over the old one." \
            --latest
