<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1d21">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Agenda</title>
<style>
:root{
  --steel:#1b1d21;
  --raised:#26292f;
  --edge:#343841;
  --chalk:#e8e6e1;
  --dim:#8d919b;
  --blue:#2f6fd0;
  --red:#c8352c;
  --yellow:#d9b23c;
  --green:#3f9160;
  --num:"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  /* person colours; overwritten from the data on every render */
  --pa:#3fb0e8;
  --pb:#ef6f8e;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{
  background:var(--steel);color:var(--chalk);
  font:400 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overscroll-behavior:none;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
input,textarea{
  background:var(--steel);border:1px solid var(--edge);border-radius:6px;
  padding:10px;width:100%;resize:none;
}
/* Android draws empty date/time fields shorter than text fields */
input[type=date],input[type=time]{min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
input.bad{border-color:var(--red)}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
h2{font:600 20px/1.2 system-ui;margin:0 0 2px}
h3{font:600 15px/1.2 system-ui;margin:0}
hr{border:none;border-top:1px solid var(--edge);margin:8px 0}
.muted{color:var(--dim);font-size:13px}
.grow{flex:1;min-width:0}

/* shell */
#top{
  display:flex;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 14px) 12px 12px 16px;
  border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--steel);z-index:5;
}
#top .day{color:var(--dim);font-size:13px}
#sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);padding:8px 6px;white-space:nowrap}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.sdot.ok{background:var(--green)}
.sdot.busy{background:var(--blue)}
.sdot.wait{background:var(--yellow)}
.sdot.err{background:var(--red)}
#gear{font-size:20px;padding:6px 8px;color:var(--dim)}
main{padding:12px 16px 150px;max-width:640px;margin:0 auto}
nav{
  position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr;
  background:var(--raised);border-top:1px solid var(--edge);
  padding-bottom:env(safe-area-inset-bottom);z-index:6;
}
nav button{padding:11px 4px 13px;color:var(--dim);font-size:12px;display:grid;gap:3px;justify-items:center}
nav button b{font-size:17px;font-weight:400;line-height:1}
nav button.on{color:var(--chalk);box-shadow:inset 0 2px 0 var(--blue)}
#add{
  position:fixed;right:16px;z-index:7;bottom:calc(env(safe-area-inset-bottom) + 74px);
  border-radius:999px;padding:14px 22px;box-shadow:0 6px 22px rgba(0,0,0,.5);
}

/* controls */
.btn{background:var(--blue);color:#fff;border-radius:8px;padding:12px 16px;font-weight:600;text-align:center}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--chalk);font-weight:500}
.btn.warn{background:var(--red);border-color:var(--red);color:#fff}
.btn.wide{display:block;width:100%}
.btn:active{filter:brightness(.9)}
.stack{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--dim);margin-bottom:4px}
.seg,.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips{margin:2px 0 14px}
.pill{
  border:1px solid var(--edge);border-radius:999px;padding:7px 13px;font-size:14px;color:var(--dim);
  display:inline-flex;align-items:center;gap:7px;
}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill.on.a{background:var(--pa);border-color:var(--pa);color:#111316}
.pill.on.b{background:var(--pb);border-color:var(--pb);color:#111316}
.pill.on.ab{background:linear-gradient(90deg,var(--pa) 50%,var(--pb) 50%);border-color:var(--edge);color:#111316}
.pill.on .dot{box-shadow:0 0 0 1.5px #111316}
.seg.bad .pill{border-color:var(--red)}
.chips .xbtn{margin-left:auto;color:var(--chalk)}
.chips.cats{margin-top:-6px}
.chips.cats .pill{white-space:nowrap;border-radius:8px}
.chips.cats .pill.on{background:var(--chalk);border-color:var(--chalk);color:#111316}
.newcat{display:flex;gap:8px;margin-top:8px}
.newcat .btn{padding:10px 16px}
.catrow{display:flex;gap:8px;align-items:center}
.subs{display:grid;gap:6px;margin:-4px 0 4px 14px;padding-left:10px;border-left:2px solid var(--edge)}
.subrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.subrow input{padding:8px;min-width:0}
.subrow [data-f="name"]{grid-column:1 / -1}
.subrow + .subrow{margin-top:6px}
.subs .linkbtn{justify-self:start;padding:4px 0}
.pill.subp small{color:inherit;opacity:.75;font-size:12px}
.x{color:var(--dim);padding:9px 11px;font-size:15px;line-height:1;border-radius:6px;flex:none}
.x.warn{color:#fff;background:var(--red)}
.xstep{display:flex;align-items:center;justify-content:space-between;gap:8px}
.xstep b{font-size:17px;text-align:center}
.xprev{display:block;width:100%;min-height:60px;border-radius:8px;border:1px solid var(--edge);background:#fff}
.muted.err{color:#ff8a80;margin-top:6px}
.linkbtn{color:var(--dim);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.empty{text-align:center;color:var(--dim);padding:22px 12px}

/* person colour marks */
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.a,.bar.a{background:var(--pa)}
.dot.b,.bar.b{background:var(--pb)}
.dot.ab{background:linear-gradient(90deg,var(--pa) 50%,var(--pb) 50%)}
.bar.ab{background:linear-gradient(var(--pa) 50%,var(--pb) 50%)}
.who{font-weight:600}
.who.a{color:var(--pa)}
.who.b{color:var(--pb)}

/* day lists */
.dayb{margin-bottom:16px}
.dayh{display:flex;align-items:baseline;gap:10px;padding:8px 0 6px;border-bottom:1px solid var(--edge)}
.dayh h3{font-size:17px}
.dayh .muted{flex:1}
.dayh .plus{color:var(--dim);font-size:24px;line-height:1;padding:0 2px 0 14px;align-self:center}
.dayb.free{margin-bottom:2px}
.dayb.free .dayh{border-bottom:none;padding:6px 0}
.dayb.free h3{color:var(--dim);font-weight:500}
.dayb.today .dayh h3{color:#fff}
.dayb.today .dayh{border-bottom-color:var(--blue)}
.ev{
  display:grid;grid-template-columns:48px 4px 1fr;gap:12px;
  width:100%;text-align:left;padding:10px 0;
}
.ev+.ev{border-top:1px solid #2a2d33}
.tm{font-family:var(--num);font-weight:700;font-size:16px;line-height:1.25;font-variant-numeric:tabular-nums}
.tm small{display:block;font-weight:400;color:var(--dim);font-size:13px}
.tm.all{font:400 12px/1.3 system-ui;color:var(--dim);padding-top:3px}
.bar{border-radius:2px;min-height:22px}
.et{display:block;font-size:16px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.es{display:block;font-size:13px;color:var(--dim);margin-top:2px;overflow-wrap:anywhere}
.ev.past{opacity:.45}

/* month */
.mhead{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.mhead h2{flex:1;text-align:center;margin:0}
.arrow{font-size:26px;line-height:1;color:var(--chalk);padding:4px 14px 8px}
.mhead .pill{padding:5px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;touch-action:pan-y}
.wd{font-size:11px;color:var(--dim);text-align:center;padding:0 0 4px}
.cell{
  min-height:52px;background:var(--raised);border:1.5px solid transparent;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px 6px;min-width:0;
}
.cell.out{background:none}
.cell.out .dn{color:#5d616b}
.cell.gone .dn{color:var(--dim)}
.cell .dn{
  font-family:var(--num);font-weight:700;font-size:15px;line-height:24px;
  min-width:26px;height:24px;border-radius:12px;text-align:center;
}
.cell.now .dn{background:var(--blue);color:#fff}
.cell.sel{border-color:var(--chalk)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:100%}
.dots .dot{width:7px;height:7px}
.dots small{font-size:10px;color:var(--dim);line-height:7px}
.mt{display:none}
.selday{margin-top:18px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:15;display:none;background:rgba(0,0,0,.6)}
#sheet.on{display:block}
#sheetbox{
  position:absolute;left:0;right:0;bottom:0;background:var(--raised);
  border-top:1px solid var(--edge);border-radius:16px 16px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 28px);
  max-height:90vh;max-height:90dvh;overflow:auto;
}
#sheetbox h2{margin-bottom:14px}
#sheetbox input{background:var(--steel)}
.sws{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:var(--chalk);box-shadow:inset 0 0 0 3px var(--raised)}
details summary{cursor:pointer;color:var(--dim);font-size:14px;padding:4px 0}
details ol{margin:8px 0 0;padding-left:20px;font-size:14px;color:var(--chalk)}
details li+li{margin-top:6px}
code{font-size:13px;background:var(--steel);border:1px solid var(--edge);border-radius:4px;padding:0 4px}
.foot{font-size:12px;color:var(--dim);text-align:center}
@media(prefers-reduced-motion:no-preference){
  #sheetbox{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(14px);opacity:.4}}
}
@media (hover:hover){
  .btn:hover{filter:brightness(1.12)}
  .pill:hover{border-color:var(--dim)}
  .ev:hover .et{text-decoration:underline;text-underline-offset:3px}
  .cell:hover{border-color:var(--edge)}
  nav button:hover{color:var(--chalk)}
}
/* wide screens: room for titles in the month grid, centred dialogs */
@media (min-width:700px){
  .cell{min-height:96px;align-items:stretch;padding:4px 4px 6px}
  .cell .dn{align-self:flex-start}
  .cell .dots{display:none}
  .mt{
    display:block;font-size:12px;line-height:1.3;padding-left:5px;border-left:3px solid var(--pa);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;
  }
  .mt.b{border-left-color:var(--pb)}
  .mt.ab{border-image:linear-gradient(var(--pa) 50%,var(--pb) 50%) 1}
  .mt.more{border:none;color:var(--dim);padding-left:0}
  main{max-width:900px}
  #add{right:max(16px,calc(50% - 450px));bottom:84px}
  #sheetbox{
    top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
    width:min(540px,92vw);max-height:86vh;max-height:86dvh;border:1px solid var(--edge);border-radius:14px;padding:22px;
  }
  .mt:not(.more){white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
}
/* computer screens: tabs up in the header, the chosen day beside the month */
@media (min-width:1100px){
  main{max-width:1240px;padding-bottom:110px}
  main[data-view="up"]{max-width:760px}
  nav{
    top:0;bottom:auto;left:50%;right:auto;transform:translateX(-50%);
    background:none;border:none;grid-template-columns:auto auto;gap:6px;padding:16px 0 0;
  }
  nav button{grid-auto-flow:column;align-items:center;gap:8px;padding:9px 18px;font-size:14px;border-radius:8px}
  nav button.on{box-shadow:none;background:var(--raised)}
  #add{right:max(24px,calc(50% - 620px));bottom:28px}
  .mbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
  .selday{margin-top:44px;position:sticky;top:92px}
}
</style>
</head>
<body>

<header id="top">
  <div class="grow">
    <h2 id="title">Próximos</h2>
    <div class="day" id="subtitle"></div>
  </div>
  <button id="sync" data-act="settings" aria-label="Estado de la sincronización"></button>
  <button id="gear" data-act="settings" aria-label="Ajustes">⚙</button>
</header>

<main id="view"></main>

<button id="add" class="btn" data-act="new">+ Evento</button>

<nav>
  <button data-tab="up" class="on"><b>☰</b>Próximos</button>
  <button data-tab="month"><b>▦</b>Mes</button>
</nav>

<div id="sheet"><div id="sheetbox"></div></div>

<script>
"use strict";

/* ---------- storage ---------- */
// The calendar itself (shared, synced) and this phone's own settings live apart:
// the token and "whose phone is this" must never travel to the other phone.
const DOC_KEY = "schedule_doc", LOCAL_KEY = "schedule_local";
function readJSON(k){
  try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
function writeJSON(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn("save failed", e); }
}

/* ---------- state ---------- */
const COLORS = ["#3fb0e8","#ef6f8e","#4cc38a","#e9a23b","#a487f0","#2fc4c4","#f07a4b","#c6cf4a"];
const PEOPLE = ["a","b"];
// Fixed ids and u:0, so two phones that start fresh hold the same three records, not six.
const SEED_CATS = [["work","Horario laboral"],["doctors","Médicos"],["birthdays","Cumpleaños"]];
// Subcategories: presets with their own hours. Fixed ids, so two phones agree.
const SEED_SUBS = () => [{id:"m", name:"Mañana", from:"07:30", to:"15:30"}, {id:"t", name:"Tarde", from:"15:30", to:"23:30"}];
// the names they had before the app was in Spanish; boot renames them once
const OLD_SEED_NAMES = {work:"Work schedule", doctors:"Doctors", birthdays:"Birthdays"};
const blankDoc = () => ({
  people:[{id:"a", name:"", color:COLORS[0], u:0}, {id:"b", name:"", color:COLORS[1], u:0}],
  cats:SEED_CATS.map(([id, name])=>Object.assign({id, name, free:"", u:0}, id === "work" ? {subs:SEED_SUBS()} : {})),
  events:[]
});
// S is shared between the phones. Every record carries u (last change, ms);
// on sync the newer copy of each record wins. Deletes leave a tombstone.
let S = blankDoc();
// L belongs to this phone only.
let L = {me:"", filter:"all", cat:"", tab:"up", lang:"es", xkind:"m", repo:"", token:"", dirty:false, last:0};
let month = "", selDay = "", ahead = 60, edits = 0;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const person = id => S.people.find(p=>p.id === id) || blankDoc().people[id === "b" ? 1 : 0];
const name = id => person(id).name || (id === "b" ? "Persona 2" : "Persona 1");
const stamp = old => Math.max(Date.now(), old && old.u ? old.u + 1 : 0);
const cats = () => S.cats.filter(c=>!c.del).sort((x,y)=>x.name.localeCompare(y.name));
const catById = id => id ? S.cats.find(c=>c.id === id && !c.del) || null : null;

function saveDoc(){ writeJSON(DOC_KEY, S); }
function saveLocal(){ writeJSON(LOCAL_KEY, L); }
// Every change to the shared calendar goes through here.
function changed(){
  edits++; L.dirty = true;
  saveDoc(); saveLocal(); render(); scheduleSync(1200);
}
// Shifts saved without a title carry the category's name: they're renamed along with it.
function renameCat(c, n){
  const was = c.name;
  Object.assign(c, {name:n, u:stamp(c)});
  S.events.forEach((ev, i)=>{
    if(!ev.del && ev.cat === c.id && ev.title === was) S.events[i] = Object.assign({}, ev, {title:n, by:L.me, u:stamp(ev)});
  });
}
// The three starting categories had English names before the app was in Spanish.
// Runs at boot and after every sync, so a copy that arrives from the other phone is caught too.
function spanishSeeds(){
  let n = 0;
  S.cats.forEach(c=>{
    const es = (SEED_CATS.find(x=>x[0] === c.id) || [])[1];
    if(!c.del && es && c.name === OLD_SEED_NAMES[c.id]){
      renameCat(c, es);
      if(c.id === "work" && !c.subs) c.subs = SEED_SUBS();
      n++;
    }
  });
  return n;
}
function upsert(rec, list){
  const arr = S[list || "events"], i = arr.findIndex(e=>e.id === rec.id);
  if(i < 0) arr.push(rec); else arr[i] = rec;
}

/* ---------- date helpers ---------- */
// Dates are "YYYY-MM-DD" strings. Day arithmetic runs in UTC so DST never shifts a day.
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => iso(new Date());
const nowHM = () => { const d = new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const D = s => { const p = s.split("-"); return new Date(Date.UTC(+p[0], p[1]-1, +p[2])); };
const ymd = t => t.getUTCFullYear()+"-"+pad(t.getUTCMonth()+1)+"-"+pad(t.getUTCDate());
const addDays = (s, n) => { const t = D(s); t.setUTCDate(t.getUTCDate()+n); return ymd(t); };
const diffDays = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const weekday = s => D(s).getUTCDay();
const DAYS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const SHORT = ["dom","lun","mar","mié","jue","vie","sáb"];
const MONTHS = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const cap = s => s.charAt(0).toLocaleUpperCase() + s.slice(1);
const mon = s => MONTHS[+s.slice(5,7)-1].slice(0,3);
const yearTail = s => s.slice(0,4) === today().slice(0,4) ? "" : " " + s.slice(0,4);
const pretty = s => SHORT[weekday(s)]+" "+(+s.slice(8))+" "+mon(s)+yearTail(s);
const longDay = s => cap(DAYS[weekday(s)])+" "+(+s.slice(8))+" de "+MONTHS[+s.slice(5,7)-1]+yearTail(s);
const hm = ms => { const d = new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes()); };
function addMonths(ym, n){
  const t = new Date(Date.UTC(+ym.slice(0,4), +ym.slice(5,7)-1+n, 1));
  return ymd(t).slice(0,7);
}

/* ---------- which events fall on a day ---------- */
const REPEATS = [["","No"],["w","Cada semana"],["2w","Cada 2 semanas"],["m","Cada mes"],["y","Cada año"]];
const REPEAT_TEXT = {w:"cada semana", "2w":"cada 2 semanas", m:"cada mes", y:"cada año"};
const spanOf = ev => ev.last && ev.last > ev.date ? diffDays(ev.date, ev.last) : 0;
function startsOn(ev, s){
  const n = diffDays(ev.date, s);
  if(n < 0) return false;
  if(ev.repeat === "w")  return n % 7 === 0;
  if(ev.repeat === "2w") return n % 14 === 0;
  if(ev.repeat === "m")  return s.slice(8) === ev.date.slice(8);
  if(ev.repeat === "y")  return s.slice(5) === ev.date.slice(5);
  return n === 0;
}
// The first day of the occurrence that covers `day`, or "" if the event isn't on it.
// A multi-day event covers its start day plus `span` more days, every time it repeats.
function occStart(ev, day){
  const span = spanOf(ev);
  for(let k = 0; k <= span; k++){
    const s = k ? addDays(day, -k) : day;
    if(s < ev.date) return "";
    if(ev.repeat && ev.until && s > ev.until) continue;
    if(ev.skip && ev.skip.includes(s)) continue;
    if(startsOn(ev, s)) return s;
  }
  return "";
}
function visible(){
  const c = catById(L.cat);
  return S.events.filter(e => !e.del && e.date && (L.filter === "all" || e.who === L.filter || e.who === "ab")
    && (!c || e.cat === c.id));
}
// [{ev, s}] for one day: all-day and continuing trips first, then by start time.
function dayEvents(list, day){
  const out = [];
  list.forEach(ev=>{ const s = occStart(ev, day); if(s) out.push({ev, s}); });
  const key = o => (o.ev.from || "") + " " + o.ev.title.toLowerCase();
  return out.sort((x,y)=> key(x) < key(y) ? -1 : key(x) > key(y) ? 1 : 0);
}

/* ---------- views ---------- */
const view = document.getElementById("view");
const T = document.getElementById("title");
const SUB = document.getElementById("subtitle");

function render(){
  document.documentElement.style.setProperty("--pa", person("a").color);
  document.documentElement.style.setProperty("--pb", person("b").color);
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab === L.tab));
  SUB.textContent = longDay(today());
  view.dataset.view = L.tab;
  if(L.tab === "month") renderMonth(); else renderUp();
  drawSync();
}

function whoText(w){
  if(w === "ab") return `<b class="who a">${esc(name("a"))}</b> &amp; <b class="who b">${esc(name("b"))}</b>`;
  return `<b class="who ${w}">${esc(name(w))}</b>`;
}
function evRow(o, day){
  // a multi-day event shows its hours on every day it covers
  const ev = o.ev, timed = !!ev.from;
  const bits = [whoText(ev.who)], c = catById(ev.cat);
  const sb = c && ev.sub ? (c.subs || []).find(s=>s.id === ev.sub) : null;
  if(c && c.name !== ev.title) bits.push(esc(c.name));
  if(sb && sb.name) bits.push(esc(sb.name));
  if(ev.repeat) bits.push(REPEAT_TEXT[ev.repeat] || "");
  if(ev.note) bits.push(esc(ev.note.split("\n")[0]));
  const now = today();
  const past = day < now || (day === now && timed && (ev.to && ev.to > ev.from ? ev.to : ev.from) < nowHM());
  return `<button class="ev ${past ? "past" : ""}" data-act="edit" data-id="${ev.id}" data-d="${o.s}">
    ${timed
      ? `<span class="tm">${ev.from}${ev.to ? `<small>${ev.to}</small>` : ""}</span>`
      : `<span class="tm all">todo el día</span>`}
    <i class="bar ${ev.who}"></i>
    <span><span class="et">${esc(ev.title)}</span><span class="es">${bits.join(" · ")}</span></span>
  </button>`;
}
function chips(){
  const one = (v, t, cls) => `<button class="pill ${cls} ${L.filter === v ? "on" : ""}" data-act="filter" data-v="${v}">${t}</button>`;
  const cur = catById(L.cat) ? L.cat : "";
  const cs = [["", "Todas las categorías"]].concat(cats().map(c=>[c.id, esc(c.name)]));
  return `<div class="chips">
    ${one("all", "Todos", "")}
    ${PEOPLE.map(p=>one(p, `<i class="dot ${p}"></i>${esc(name(p))}`, p)).join("")}
    <button class="pill xbtn" data-act="xopen">Exportar</button>
  </div>
  ${cs.length > 1 ? `<div class="chips cats">${cs.map(([v, t])=>
    `<button class="pill ${cur === v ? "on" : ""}" data-act="catf" data-v="${v}">${t}</button>`).join("")}</div>` : ""}`;
}

/* --- Upcoming: the next seven days always, after that only days with something on --- */
function renderUp(){
  T.textContent = "Próximos";
  const list = visible(), start = today();
  let html = chips(), later = 0;
  for(let i = 0; i < ahead; i++){
    const d = addDays(start, i), evs = dayEvents(list, d);
    if(i >= 7 && !evs.length) continue;
    if(i >= 7) later++;
    const head = i === 0 ? "Hoy" : i === 1 ? "Mañana" : i < 7 ? cap(DAYS[weekday(d)]) : cap(pretty(d));
    const side = i < 7 ? (+d.slice(8))+" "+mon(d) : i < 14 ? "en "+i+" días" : "en "+Math.round(i/7)+" semanas";
    html += `<section class="dayb ${i === 0 ? "today" : ""} ${evs.length ? "" : "free"}">
      <div class="dayh">
        <h3>${head}</h3><span class="muted">${side}${evs.length ? "" : " · libre"}</span>
        <button class="plus" data-act="new" data-d="${d}" aria-label="Añadir el ${pretty(d)}">+</button>
      </div>
      ${evs.map(o=>evRow(o, d)).join("")}
    </section>`;
  }
  if(!list.length) html += `<div class="empty">Todavía no hay nada.<br>Toca <b>+ Evento</b> para añadir el primero.</div>`;
  else if(!later) html += `<div class="empty">Nada más en los próximos ${ahead} días.</div>`;
  html += `<button class="btn ghost wide" data-act="more">Ver más adelante</button>`;
  view.innerHTML = html;
}

/* --- Month: grid with a dot per event, the chosen day listed underneath --- */
function renderMonth(){
  T.textContent = "Mes";
  if(!month) month = today().slice(0,7);
  if(!selDay || selDay.slice(0,7) !== month) selDay = today().slice(0,7) === month ? today() : month+"-01";
  const list = visible(), first = month+"-01", now = today();
  const lead = (weekday(first) + 6) % 7;          // weeks start on Monday
  const len = diffDays(first, addMonths(month, 1)+"-01");
  const cells = Math.ceil((lead + len) / 7) * 7;
  let grid = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i = 0; i < cells; i++){
    const d = addDays(first, i - lead), evs = dayEvents(list, d);
    const cls = [d.slice(0,7) !== month ? "out" : "", d === now ? "now" : "", d === selDay ? "sel" : "", d < now ? "gone" : ""].join(" ");
    const dots = evs.slice(0,4).map(o=>`<i class="dot ${o.ev.who}"></i>`).join("") + (evs.length > 4 ? `<small>+</small>` : "");
    const titles = evs.slice(0,3).map(o=>`<span class="mt ${o.ev.who}">${o.ev.from ? o.ev.from+" " : ""}${esc(o.ev.title)}</span>`).join("")
      + (evs.length > 3 ? `<span class="mt more">+${evs.length-3} más</span>` : "");
    grid += `<button class="cell ${cls}" data-act="pickDay" data-d="${d}" aria-label="${longDay(d)}">
      <span class="dn">${+d.slice(8)}</span><span class="dots">${dots}</span>${titles}
    </button>`;
  }
  const evs = dayEvents(list, selDay);
  view.innerHTML = `${chips()}
    <div class="mbody"><div>
    <div class="mhead">
      <button class="arrow" data-act="month" data-v="-1" aria-label="Mes anterior">‹</button>
      <h2>${cap(MONTHS[+month.slice(5)-1])} ${month.slice(0,4)}</h2>
      ${month !== now.slice(0,7) ? `<button class="pill" data-act="month" data-v="0">Hoy</button>` : ""}
      <button class="arrow" data-act="month" data-v="1" aria-label="Mes siguiente">›</button>
    </div>
    <div class="grid">${grid}</div>
    </div>
    <section class="dayb selday">
      <div class="dayh">
        <h3>${longDay(selDay)}</h3><span class="muted">${selDay === now ? "hoy" : ""}</span>
        <button class="plus" data-act="new" data-d="${selDay}" aria-label="Añadir el ${pretty(selDay)}">+</button>
      </div>
      ${evs.length ? evs.map(o=>evRow(o, selDay)).join("") : `<div class="empty">Libre</div>`}
    </section></div>`;
}

/* ---------- sheets (forms) ---------- */
const sheet = document.getElementById("sheet");
const box = document.getElementById("sheetbox");
// Opening a sheet adds a history entry, so Android's back button closes the
// sheet instead of leaving the app.
function openSheet(html){
  const redraw = sheet.classList.contains("on"), y = box.scrollTop;
  box.innerHTML = html;
  box.scrollTop = redraw ? y : 0;   // redrawing the same sheet keeps its place
  if(!redraw){ sheet.classList.add("on"); history.pushState({sheet:1}, ""); }
}
function hideSheet(){ sheet.classList.remove("on"); box.innerHTML = ""; }
function closeSheet(){
  if(!sheet.classList.contains("on")) return;
  hideSheet();
  if(history.state && history.state.sheet) history.back();
}
window.addEventListener("popstate", ()=>{ if(sheet.classList.contains("on")) hideSheet(); });
sheet.addEventListener("click", e=>{ if(e.target === sheet) closeSheet(); });

const val = id => { const el = $(id); return el ? el.value : ""; };
function seg(key, options, value, extra){

    `<button class="pill ${cls||""} ${v === value ? "on" : ""}" data-act="seg" data-v="${v}">${t}</button>`).join("")}${extra||""}</div>`;
}

// Subcategory buttons in the event form: those of the chosen category, or of every
// category when none is chosen. One tap saves the event with that subcategory's hours.
function subPills(catId){
  const c = catById(catId);
  const list = (c ? [c] : cats()).flatMap(k=>(k.subs || []).filter(s=>s.name || s.from).map(s=>[k, s]));
  if(!list.length) return "";
  return `<label>${c ? "Subcategoría" : "Rápido"}</label><div class="seg">${list.map(([k, s])=>
    `<button class="pill subp" data-act="subPick" data-id="${k.id}" data-v="${s.id}">${c ? "" : esc(k.name) + " · "}${esc(s.name)}${
      s.from ? ` <small>${s.from}${s.to ? "–" + s.to : ""}</small>` : ""}</button>`).join("")}</div>
    <div class="muted">Toca una para guardar el evento con su horario.</div>`;
}

function saveEvent(id, pick){
  const c = catById(pick ? pick.cat : segVal("cat"));
  const sb = pick && c ? (c.subs || []).find(s=>s.id === pick.sub) : null;
  // a shift needs no title of its own; a title that is only a time gives way to the subcategory
  let title = val("f-title").trim();
  if(sb && /^\d{1,2}[:.]\d{2}/.test(title)) title = "";
  title = title || (c ? c.name : "");
  if(!title){ const t = $("f-title"); t.classList.add("bad"); t.focus(); return; }
  const date = val("f-date") || today();
  let last = val("f-last"), from = val("f-from"), to = val("f-to");
  if(sb){ from = sb.from || ""; to = sb.to || ""; }
  if(last <= date) last = "";
  if(!from && to){ from = to; to = ""; }
  const repeat = segVal("repeat");
  const until = repeat && val("f-until") >= date ? val("f-until") : "";
  const old = id ? S.events.find(e=>e.id === id) : null;
  // an edit keeps its subcategory only while category and hours still match it
  const kept = !sb && old && old.sub && c && old.cat === c.id ? (c.subs || []).find(s=>s.id === old.sub) : null;
  const sub = sb ? sb.id : kept && kept.from === from && (kept.to || "") === to ? kept.id : "";
  // keep fields this version doesn't know about, in case a newer copy wrote them
  upsert(Object.assign({}, old || {skip:[]}, {
    id: old ? old.id : uid(), title, who: segVal("who") || "a", cat: c ? c.id : "", sub, date, last, from, to,
    repeat, until, note: val("f-note").trim(), by: L.me, u: stamp(old)
  }));
  closeSheet(); changed();
}

// "+ New" in the event form: make the category and pick it, without leaving the form
function addCatInline(){
  const inp = $("f-newcat"), n = inp.value.trim();
  if(!n){ inp.classList.add("bad"); inp.focus(); return; }
  let c = cats().find(k=>k.name.toLowerCase() === n.toLowerCase());
  if(!c){ c = {id:uid(), name:n, free:"", u:Date.now()}; S.cats.push(c); changed(); }
  const wrap = box.querySelector('[data-seg="cat"]');
  if(!wrap.querySelector(`[data-v="${c.id}"]`))
    wrap.querySelector('[data-act="catNew"]').insertAdjacentHTML("beforebegin", `<button class="pill" data-act="seg" data-v="${c.id}">${esc(c.name)}</button>`);
  wrap.dataset.val = c.id;
  wrap.querySelectorAll('[data-act="seg"]').forEach(x=>x.classList.toggle("on", x.dataset.v === c.id));
  $("subs").innerHTML = subPills(c.id);
  inp.value = ""; $("newcat").hidden = true;
}

/* ---------- export as an image ---------- */
// Drawn like a printed rota: a weekday header, then for each week a row of dates
// and a row of what's on, each week in its own pastel band. Year: twelve small months.
const LANGS = [["en","English","en-GB"],["es","Español","es-ES"],["sr","Srpski","sr-Latn-RS"],["sc","Српски","sr-Cyrl-RS"]];
const XP = {
  head:["#FCE4D6","#C55A11"],
  bands:[["#DAE3F3","#203864"],["#FFF2CC","#7F6000"],["#E2EFDA","#375623"],["#E4DFEC","#7030A0"],["#FFC7CE","#9C0006"]],
  font:'Calibri, Carlito, "Segoe UI", Roboto, Arial, sans-serif'
};
let X = null;   // the export sheet's choices while it's open

const fmt = (lang, opt) => new Intl.DateTimeFormat((LANGS.find(l=>l[0] === lang) || LANGS[0])[2], Object.assign({timeZone:"UTC"}, opt));
const weekStart = s => addDays(s, -((weekday(s) + 6) % 7));
const xfont = (px, style) => (style || "") + " " + px + "px " + XP.font;

// The days an export covers, as whole weeks (week and month) or one year.
function xrange(o){
  if(o.kind === "w"){ const a = weekStart(o.anchor); return {from:a, to:addDays(a, 6)}; }
  if(o.kind === "m"){ const a = o.anchor.slice(0,7); return {from:a + "-01", to:addDays(addMonths(a, 1) + "-01", -1)}; }
  return {from:o.anchor.slice(0,4) + "-01-01", to:o.anchor.slice(0,4) + "-12-31"};
}
function xlabel(o){   // in the app's own words, for the sheet
  const r = xrange(o);
  if(o.kind === "w") return pretty(r.from) + " – " + pretty(r.to);
  if(o.kind === "m") return cap(MONTHS[+r.from.slice(5,7)-1]) + " " + r.from.slice(0,4);
  return r.from.slice(0,4);
}
function xperiod(o){  // in the export's language, for the picture
  const r = xrange(o);
  if(o.kind === "y") return r.from.slice(0,4);
  if(o.kind === "m") return cap(fmt(o.lang, {month:"long", year:"numeric"}).format(D(r.from)));
  const f = fmt(o.lang, {day:"numeric", month:"short", year:"numeric"});
  return f.formatRange ? f.formatRange(D(r.from), D(r.to)) : f.format(D(r.from)) + " – " + f.format(D(r.to));
}

// What one day's cell says: one line per event, or the category's "free" word.
// An event named after its own category (a shift) shows just its time.
function xlines(o, free){
  const c = catById(o.cat);
  const list = S.events.filter(e => !e.del && e.date && (o.who === "all" || e.who === o.who || e.who === "ab") && (!c || e.cat === c.id));
  return day => {
    const evs = dayEvents(list, day);
    if(!evs.length) return free ? [{text:free, bold:true, free:true}] : [];
    return evs.map(x=>{
      const ev = x.ev, own = catById(ev.cat);
      const time = ev.from ? ev.from + (ev.to ? "–" + ev.to : "") : "";
      const bare = c && own && time && ev.title.trim().toLowerCase() === own.name.trim().toLowerCase();
      return {text:(time + " " + (bare ? "" : ev.title)).trim(), dot:o.who === "all" && ev.who !== "ab" ? person(ev.who).color : ""};
    });
  };
}

function wrapText(g, text, max){
  const out = [];
  let cur = "";
  text.split(/\s+/).forEach(w=>{
    const t = cur ? cur + " " + w : w;
    if(!cur || g.measureText(t).width <= max) cur = t; else { out.push(cur); cur = w; }
  });
  if(cur) out.push(cur);
  return out.map(s=>{
    if(g.measureText(s).width <= max) return s;
    while(s.length > 1 && g.measureText(s + "…").width > max) s = s.slice(0, -1);
    return s + "…";
  });
}

function picture(o, free){
  const c = catById(o.cat);
  const title = [c ? c.name : "", o.who !== "all" ? name(o.who) : ""].filter(Boolean).join(" · ") || "Agenda";
  const lines = xlines(o, free), r = xrange(o);
  // the year leaves out the "free" word: on months nobody has planned yet it would mislead
  if(o.kind === "y") return yearPicture(o, title, xlines(o, ""), r);
  const weeks = [];
  for(let d = weekStart(r.from); d <= r.to; d = addDays(d, 7)) weeks.push([0,1,2,3,4,5,6].map(i=>addDays(d, i)));
  return weeksPicture(o, title, lines, r, weeks);
}

function weeksPicture(o, title, lines, r, weeks){
  const COLW = 210, PAD = 32, TOP = 96, HEAD = 54, DATE = 48, LH = 34, FS = 27;
  const W = PAD*2 + COLW*7, cv = document.createElement("canvas"), g = cv.getContext("2d");
  const names = [0,1,2,3,4,5,6].map(i=>fmt(o.lang, {weekday:"long"}).format(D(addDays("2024-01-01", i))).toLocaleUpperCase());
  const dateF = fmt(o.lang, {day:"numeric", month:"short"});
  // lay out first: a week's row is as tall as its busiest day
  const rows = weeks.map(days=>{
    const cells = days.map(d=>lines(d).flatMap(l=>{
      g.font = xfont(FS, l.bold ? "bold" : "");
      return wrapText(g, l.text, COLW - 24 - (l.dot ? 20 : 0)).map((t, i)=>Object.assign({}, l, {text:t, dot:i ? "" : l.dot}));
    }));
    return {days, cells, h:Math.max(58, Math.max(1, ...cells.map(x=>x.length)) * LH + 24)};
  });
  cv.width = W;
  cv.height = TOP + HEAD + rows.reduce((s, x)=>s + DATE + x.h, 0) + PAD;
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, cv.height);
  g.textBaseline = "middle";
  g.fillStyle = "#1b1d21"; g.textAlign = "left"; g.font = xfont(36, "bold"); g.fillText(title, PAD, TOP/2);
  g.fillStyle = "#555"; g.textAlign = "right"; g.font = xfont(30); g.fillText(xperiod(o), W - PAD, TOP/2);

  let y = TOP;
  g.fillStyle = XP.head[0]; g.fillRect(PAD, y, COLW*7, HEAD);
  g.textAlign = "center"; g.font = xfont(23, "italic bold");
  names.forEach((n, i)=>{
    const cx = PAD + COLW*i + COLW/2, w = g.measureText(n).width;
    g.fillStyle = XP.head[1]; g.fillText(n, cx, y + HEAD/2); g.fillRect(cx - w/2, y + HEAD/2 + 13, w, 2);
  });
  g.strokeStyle = "#000"; g.lineWidth = 1.5;
  for(let i = 0; i < 7; i++) g.strokeRect(PAD + COLW*i, y, COLW, HEAD);
  y += HEAD;

  rows.forEach((row, wi)=>{
    const [bg, fg] = XP.bands[wi % XP.bands.length];
    row.days.forEach((d, i)=>{
      const x = PAD + COLW*i, cx = x + COLW/2, inside = d >= r.from && d <= r.to;
      g.fillStyle = bg; g.fillRect(x, y, COLW, DATE + row.h);
      g.globalAlpha = inside ? 1 : .45;          // days from the next or previous month
      g.fillStyle = fg; g.font = xfont(26); g.textAlign = "center"; g.fillText(dateF.format(D(d)), cx, y + DATE/2);
      g.globalAlpha = 1;
      const ls = row.cells[i], top = y + DATE + (row.h - ls.length*LH)/2 + LH/2;
      ls.forEach((l, k)=>{
        const ty = top + k*LH;
        g.font = xfont(FS, l.bold ? "bold" : ""); g.fillStyle = fg;
        if(!l.dot){ g.textAlign = "center"; g.fillText(l.text, cx, ty); return; }
        const w = g.measureText(l.text).width, sx = cx - (w + 20)/2;
        g.beginPath(); g.arc(sx + 6, ty, 6, 0, 2*Math.PI); g.fillStyle = l.dot; g.fill();
        g.fillStyle = fg; g.textAlign = "left"; g.fillText(l.text, sx + 20, ty);
      });
      g.strokeStyle = "#000"; g.lineWidth = 1.5;
      g.strokeRect(x, y, COLW, DATE); g.strokeRect(x, y + DATE, COLW, row.h);
    });
    g.lineWidth = 3; g.beginPath(); g.moveTo(PAD, y); g.lineTo(PAD + COLW*7, y); g.stroke();
    y += DATE + row.h;
  });
  g.lineWidth = 3; g.strokeRect(PAD, TOP, COLW*7, y - TOP);
  return cv;
}

function yearPicture(o, title, lines, r){
  const PAD = 40, TOP = 116, GAP = 36, CW = 110, CH = 92, MH = 56, WH = 38, FS = 22;
  const MW = CW*7, BH = MH + WH + CH*6, year = r.from.slice(0,4);
  const W = PAD*2 + MW*3 + GAP*2, cv = document.createElement("canvas"), g = cv.getContext("2d");
  cv.width = W; cv.height = TOP + BH*4 + GAP*3 + PAD;
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, cv.height);
  g.textBaseline = "middle";
  g.fillStyle = "#1b1d21"; g.textAlign = "left"; g.font = xfont(44, "bold"); g.fillText(title, PAD, TOP/2);
  g.fillStyle = "#555"; g.textAlign = "right"; g.font = xfont(40); g.fillText(year, W - PAD, TOP/2);
  const initials = [0,1,2,3,4,5,6].map(i=>fmt(o.lang, {weekday:"narrow"}).format(D(addDays("2024-01-01", i))).toLocaleUpperCase());
  const monthF = fmt(o.lang, {month:"long"});

  for(let m = 0; m < 12; m++){
    const ox = PAD + (m % 3)*(MW + GAP), oy = TOP + Math.floor(m / 3)*(BH + GAP);
    const [bg, fg] = XP.bands[m % XP.bands.length], first = year + "-" + pad(m+1) + "-01";
    g.fillStyle = bg; g.fillRect(ox, oy, MW, MH);
    g.fillStyle = fg; g.textAlign = "center"; g.font = xfont(30, "bold"); g.fillText(cap(monthF.format(D(first))), ox + MW/2, oy + MH/2);
    g.fillStyle = XP.head[0]; g.fillRect(ox, oy + MH, MW, WH);
    g.fillStyle = XP.head[1]; g.font = xfont(20, "italic bold");
    initials.forEach((n, i)=>g.fillText(n, ox + CW*i + CW/2, oy + MH + WH/2));
    const lead = (weekday(first) + 6) % 7;
    for(let k = 0; k < 42; k++){
      const d = addDays(first, k - lead), x = ox + (k % 7)*CW, y = oy + MH + WH + Math.floor(k / 7)*CH;
      if(d.slice(0,7) !== first.slice(0,7)) continue;   // other months' days stay blank
      {
        const ls = lines(d), busy = ls.length > 0;
        if(busy){ g.fillStyle = bg; g.fillRect(x, y, CW, CH); }
        g.fillStyle = busy ? fg : "#666"; g.textAlign = "left"; g.font = xfont(20, busy ? "bold" : ""); g.fillText(String(+d.slice(8)), x + 7, y + 16);
        // up to two short lines; anything beyond becomes "+n"
        let out = [];
        ls.forEach(l=>{ g.font = xfont(FS, l.bold ? "bold" : ""); wrapText(g, l.text, CW - 10).forEach(t=>out.push(Object.assign({}, l, {text:t}))); });
        if(out.length > 2) out = [out[0], {text:"+" + (out.length - 1), bold:false}];
        out.forEach((l, j)=>{
          g.fillStyle = fg; g.textAlign = "center"; g.font = xfont(FS, l.bold ? "bold" : "");
          g.fillText(l.text, x + CW/2, y + (out.length === 1 ? CH/2 + 12 : CH/2 + j*25));
        });
      }
      g.strokeStyle = "#8a8a8a"; g.lineWidth = 1; g.strokeRect(x, y, CW, CH);
    }
    g.strokeStyle = "#000"; g.lineWidth = 2.5; g.strokeRect(ox, oy, MW, BH);
  }
  return cv;
}

/* ---------- sync through a private GitHub repository ---------- */
// The whole calendar is one file, calendar.json, in a private repo. Each phone
// reads it, merges record by record (newest change wins), and writes it back
// with the sha it read. If the other phone wrote in between, GitHub refuses the
// write (409) and we go round again with its version. Every write is a commit,
// so the repo's history doubles as a change log and an undo of last resort.
const FILE = "calendar.json";
let SY = {kind:"off", msg:""}, syncing = false, again = false, syncT = null;

function b64e(s){
  const bytes = new TextEncoder().encode(s);
  let bin = "";
  for(let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c=>c.charCodeAt(0)));
const flat = o => JSON.stringify(o, Object.keys(o).sort());
const newer = (p, q) => (p.u||0) !== (q.u||0) ? (p.u||0) > (q.u||0) : flat(p) > flat(q);

function normalize(d){
  const out = blankDoc();
  if(!d || typeof d !== "object") return out;
  if(Array.isArray(d.people)) out.people = out.people.map(p=>{
    const q = d.people.find(x=>x && x.id === p.id);
    return q ? {id:p.id, name:String(q.name||""), color:/^#[0-9a-f]{6}$/i.test(q.color) ? q.color : p.color, u:+q.u||0} : p;
  });
  if(Array.isArray(d.cats)) out.cats = d.cats.filter(c=>
    c && typeof c.id === "string" && (c.del || typeof c.name === "string"));
  if(Array.isArray(d.events)) out.events = d.events.filter(e=>
    e && typeof e.id === "string" && (e.del || (/^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.title === "string")));
  return out;
}
function mergeList(a, b){
  const m = new Map();
  a.concat(b).forEach(e=>{ const c = m.get(e.id); if(!c || newer(e, c)) m.set(e.id, e); });
  return [...m.values()];
}
function merge(x, y){
  const people = x.people.map(p=>{ const q = y.people.find(o=>o.id === p.id); return q && newer(q, p) ? q : p; });
  return {people, cats:mergeList(x.cats, y.cats), events:mergeList(x.events, y.events)};
}
// One event per line, sorted, so the repo's history shows clean one-line diffs.
// Before v3 the app dropped top-level keys it didn't know; "cats" is safe because
// no older copy was ever in use, but keep that in mind before adding another.
const byId = list => list.slice().sort((p,q)=> p.id < q.id ? -1 : p.id > q.id ? 1 : 0).map(flat);
function serialize(d){
  return '{"app":"schedule","v":1,\n"people":[' + d.people.map(flat).join(",") + '],\n"cats":[' + byId(d.cats).join(",")
    + '],\n"events":[\n' + byId(d.events).join(",\n") + "\n]}\n";
}
function commitMessage(before, after){
  const old = new Map((before ? before.events : []).map(e=>[e.id, e]));
  const bits = [];
  after.events.forEach(e=>{
    const o = old.get(e.id);
    if(!o){ if(!e.del) bits.push("+ " + e.title); }
    else if(o.u !== e.u && !o.del) bits.push(e.del ? "- " + o.title : "~ " + e.title);
  });
  if(before && after.people.some(p=>flat(p) !== flat(before.people.find(x=>x.id === p.id) || {}))) bits.push("names/colours");
  if(before && byId(after.cats).join() !== byId(before.cats).join()) bits.push("categories");
  const who = L.me ? name(L.me) : "Phone";
  return who + ": " + (bits.slice(0,4).join(", ") + (bits.length > 4 ? " and " + (bits.length-4) + " more" : "") || "sync");
}

async function gh(method, body){
  const opt = {
    method, cache:"no-store",
    headers:{Authorization:"Bearer " + L.token, Accept:"application/vnd.github+json"}
  };
  if(body){ opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  if(window.AbortSignal && AbortSignal.timeout) opt.signal = AbortSignal.timeout(20000);
  return fetch("https://api.github.com/repos/" + L.repo + "/contents/" + FILE, opt);
}
function failure(status){
  const e = new Error(
    status === 401 ? "GitHub rechazó el token. Puede haber caducado: crea uno nuevo y vuelve a conectar." :
    status === 403 ? "El token no tiene permiso para cambiar " + L.repo + ". Necesita Contents: Read and write." :
    status === 404 ? "No se encuentra " + L.repo + ". Revisa el nombre y que el token tenga acceso a él." :
    "GitHub respondió " + status + ". Se reintentará más tarde.");
  e.http = status;
  return e;
}
function scheduleSync(ms){ clearTimeout(syncT); syncT = setTimeout(sync, ms || 0); }
function setSync(kind, msg){ SY = {kind, msg: msg || ""}; drawSync(); }
function drawSync(){
  const label = {off:"Sin compartir", busy:"Sincronizando", ok:"Sincronizado", wait:L.dirty ? "Pendiente" : "Sin conexión", err:"Error de sincronización"}[SY.kind];
  $("sync").innerHTML = `<i class="sdot ${SY.kind}"></i>${label}`;
  const st = $("s-status"); if(st) st.textContent = syncDetail();
}

async function sync(){
  if(!L.repo || !L.token){ setSync("off"); return; }
  if(syncing){ again = true; return; }
  syncing = true;
  if(L.dirty) setSync("busy");
  const startEdits = edits;
  try{
    for(let tries = 0; ; tries++){
      if(tries === 5) throw new Error("Los dos móviles escribían a la vez. Se reintentará enseguida.");
      const r = await gh("GET");
      let remote = null, sha = "";
      if(r.ok){
        const j = await r.json();
        if(j.encoding !== "base64") throw new Error(FILE + " es demasiado grande para leerlo.");
        remote = normalize(JSON.parse(b64d(j.content)));
        sha = j.sha;
      }
      else if(r.status !== 404) throw failure(r.status);
      const merged = remote ? merge(S, remote) : S;
      if(!remote || serialize(merged) !== serialize(remote)){
        const w = await gh("PUT", {
          message: commitMessage(remote, merged),
          content: b64e(serialize(merged)),
          ...(sha ? {sha} : {})
        });
        if(w.status === 409 || w.status === 422) continue;   // the other phone got there first
        if(!w.ok) throw failure(w.status);
      }
      // edits made while we were waiting on the network are newer, so they survive this
      const before = serialize(S);
      S = merge(S, merged);
      if(spanishSeeds()){ edits++; L.dirty = true; }   // an English-named copy came in from the other phone
      saveDoc();
      if(serialize(S) !== before) render();
      break;
    }
    L.last = Date.now();
    if(edits === startEdits) L.dirty = false; else again = true;
    setSync("ok");
  }catch(e){
    if(e.http || e instanceof SyntaxError || /demasiado grande|a la vez/.test(e.message)) setSync("err", e.message);
    else setSync("wait");   // fetch failed: no connection
  }finally{
    syncing = false;
    saveLocal(); drawSync();
    if(again){ again = false; scheduleSync(300); }
  }
}

function setupLink(){
  return location.href.split("#")[0] + "#join=" + encodeURIComponent(b64e(JSON.stringify({repo:L.repo, token:L.token})));
}
// Opens the Android widget app with the same connection. If the app isn't installed,
// Chrome goes to the fallback: the page the APK is downloaded from.
function widgetLink(){
  const d = encodeURIComponent(b64e(JSON.stringify({repo:L.repo, token:L.token})));
  const app = encodeURIComponent(location.href.split("#")[0]);
  const owner = location.hostname.match(/^([\w-]+)\.github\.io$/), repo = location.pathname.split("/")[1];
  const fallback = owner && repo
    ? ";S.browser_fallback_url=" + encodeURIComponent("https://github.com/" + owner[1] + "/" + repo + "/releases/latest") : "";
  return "intent://setup?d=" + d + "&u=" + app + "#Intent;scheme=schedulewidget;package=io.github.x882b.schedule" + fallback + ";end";
}
// Connect: "calendar-data" on its own is enough, GitHub tells us whose token it is.
async function connectSync(btn){
  const token = val("f-token").trim();
  let repo = cleanRepo(val("f-repo"));
  const say = (id, msg) => { $(id).classList.add("bad"); const h = $("f-repo-hint"); h.textContent = msg; h.classList.add("err"); };
  if(!repo) return say("f-repo", "Escribe el nombre del repositorio, p. ej. calendar-data.");
  if(!token) return say("f-token", "Pega también el token de acceso.");
  if(!repo.includes("/")){
    btn.textContent = "Comprobando…";
    let r = null, me = "";
    try{ r = await fetch("https://api.github.com/user", {cache:"no-store", headers:{Authorization:"Bearer " + token, Accept:"application/vnd.github+json"}}); }catch(e){}
    if(r && r.ok) me = ((await r.json().catch(()=>({}))).login) || "";
    btn.textContent = "Conectar";
    if(!r) return say("f-repo", "Sin conexión. Inténtalo de nuevo cuando haya internet.");
    if(!me) return say("f-token", "GitHub rechazó este token. Comprueba que lo copiaste entero.");
    repo = me + "/" + repo;
  }
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) return say("f-repo", "Eso no es un nombre de repositorio. Escríbelo como calendar-data o tu-usuario/calendar-data.");
  L.repo = repo; L.token = token; L.dirty = true; saveLocal();
  sync().then(()=>{ if(sheet.classList.contains("on") && $("s-status")) settingsSheet(); });
  settingsSheet();
}
function cleanRepo(s){
  return s.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/, "").replace(/\/+$/, "");
}

/* ---------- interaction ---------- */
document.body.addEventListener("click", e=>{
  const tab = e.target.closest("[data-tab]");
  if(tab){ L.tab = tab.dataset.tab; saveLocal(); render(); window.scrollTo(0,0); return; }
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const a = b.dataset.act, id = b.dataset.id, d = b.dataset.d, v = b.dataset.v;

  if(a === "new") eventSheet(null, d || (L.tab === "month" ? selDay : today()));
  else if(a === "edit") eventSheet(id, d);
  else if(a === "filter"){ L.filter = v; saveLocal(); render(); }
  else if(a === "catf"){ L.cat = v; saveLocal(); render(); }
  else if(a === "more"){ ahead += 90; render(); }
  else if(a === "pickDay"){
    selDay = d;
    if(d.slice(0,7) !== month) month = d.slice(0,7);
    render();
  }
  else if(a === "month"){
    month = +v ? addMonths(month, +v) : today().slice(0,7);
    selDay = "";
    render();
  }
  else if(a === "seg"){
    const wrap = b.closest("[data-seg]");
    wrap.dataset.val = v;
    wrap.classList.remove("bad");
    wrap.querySelectorAll(".pill").forEach(x=>x.classList.toggle("on", x === b));
    if(wrap.dataset.seg === "repeat") $("untilrow").hidden = !v;
    if(wrap.dataset.seg === "cat") $("subs").innerHTML = subPills(v);
    if(wrap.dataset.seg === "me" && $("s-status")){ L.me = v; saveLocal(); render(); }
    const k = wrap.dataset.seg;
    if(k === "xkind"){ X.kind = v; L.xkind = v; saveLocal(); exportSheet(); }
    else if(k === "xcat"){ X.cat = v; exportSheet(); }
    else if(k === "xwho"){ X.who = v; drawPreview(); }
    else if(k === "xlang"){ X.lang = v; L.lang = v; saveLocal(); drawPreview(); }
  }
  else if(a === "catNew"){ $("newcat").hidden = false; $("f-newcat").focus(); }
  else if(a === "catAdd") addCatInline();
  else if(a === "catCreate"){
    const c = {id:uid(), name:"Nueva categoría", free:"", u:Date.now()};
    S.cats.push(c); changed(); settingsSheet();
    const el = $("s-cat-" + c.id); if(el){ el.focus(); el.select(); }
  }
  else if(a === "catDel"){
    if(!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Borrar"; b.classList.add("warn"); return; }
    const old = S.cats.find(c=>c.id === id); if(!old) return;
    // its events keep their place in the calendar, just without a category
    upsert({id, del:1, u:stamp(old)}, "cats");
    if(L.cat === id) L.cat = "";
    changed(); settingsSheet();
  }
  else if(a === "xopen"){
    X = {kind:L.xkind || "m", anchor:L.tab === "month" ? (selDay || month + "-01") : today(),
         cat:catById(L.cat) ? L.cat : "", who:L.filter, lang:L.lang || "en"};
    exportSheet();
  }
  else if(a === "xstep"){
    const n = +v;
    X.anchor = X.kind === "w" ? addDays(weekStart(X.anchor), 7*n)
      : X.kind === "m" ? addMonths(X.anchor.slice(0,7), n) + "-01" : (+X.anchor.slice(0,4) + n) + "-01-01";
    exportSheet();
  }
  else if(a === "xsave") xfile().then(saveFile);
  else if(a === "xshare") xfile().then(f=>{
    if(navigator.canShare && navigator.canShare({files:[f]})) navigator.share({files:[f], title:f.name}).catch(()=>{});
    else saveFile(f);
  });
  else if(a === "clearTime"){ $("f-from").value = ""; $("f-to").value = ""; }
  else if(a === "saveEv") saveEvent(id);
  else if(a === "subPick") saveEvent(box.querySelector('[data-act="saveEv"]').dataset.id, {cat:id, sub:v});
  else if(a === "subAdd"){
    const c = catById(id); if(!c) return;
    const s = {id:uid(), name:"", from:"", to:""};
    Object.assign(c, {subs:(c.subs || []).concat(s), u:stamp(c)});
    changed(); settingsSheet();
    const el = box.querySelector(`[data-sid="${s.id}"][data-f="name"]`); if(el) el.focus();
  }
  else if(a === "subDel"){
    if(!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Borrar"; b.classList.add("warn"); return; }
    const c = catById(id); if(!c) return;
    Object.assign(c, {subs:(c.subs || []).filter(s=>s.id !== v), u:stamp(c)});
    changed(); settingsSheet();
  }
  else if(a === "skipDay"){
    const old = S.events.find(x=>x.id === id); if(!old) return;
    upsert(Object.assign({}, old, {skip:(old.skip||[]).concat(d), by:L.me, u:stamp(old)}));
    closeSheet(); changed();
  }
  else if(a === "delEv"){
    // two taps, so a stray touch never deletes anything
    if(!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "Toca otra vez para borrar"; b.classList.add("warn"); return; }
    const old = S.events.find(x=>x.id === id); if(!old) return;
    upsert({id, del:1, by:L.me, u:stamp(old)});
    closeSheet(); changed();
  }
  else if(a === "welcomeDone"){
    if(!segVal("me")){ box.querySelector('[data-seg="me"]').classList.add("bad"); return; }
    L.me = segVal("me");
    PEOPLE.forEach(p=>{
      const n = val("w-" + p).trim(), cur = person(p);
      if(n && n !== cur.name) Object.assign(cur, {name:n, u:stamp(cur)});
    });
    closeSheet(); changed();
  }
  else if(a === "settings") settingsSheet();
  else if(a === "color"){
    const p = person(b.dataset.p);
    Object.assign(p, {color:v, u:stamp(p)});
    changed(); settingsSheet();
  }
  else if(a === "saveSync") connectSync(b);
  else if(a === "syncNow") sync();
  else if(a === "shareSetup"){
    const link = setupLink();
    if(navigator.share) navigator.share({title:"Agenda", text:"Abre esto en tu móvil para unirte a nuestro calendario:", url:link}).catch(()=>{});
    else if(navigator.clipboard) navigator.clipboard.writeText(link).then(()=>alert("Enlace copiado. Mándalo al otro móvil."), ()=>prompt("Copia este enlace:", link));
    else prompt("Copia este enlace:", link);
  }
  else if(a === "widget") location.href = widgetLink();
  else if(a === "unlink"){
    L.repo = ""; L.token = ""; saveLocal(); setSync("off"); settingsSheet();
  }
  else if(a === "export"){
    const blob = new Blob([serialize(S)], {type:"application/json"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "agenda-" + today() + ".json";
    link.click();
  }
  else if(a === "import"){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files[0]; if(!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try{
          const data = JSON.parse(rd.result);
          if(!Array.isArray(data.events)) throw 0;
          const n = S.events.length;
          S = merge(S, normalize(data));
          changed(); settingsSheet();
          alert("Importado. " + (S.events.length - n) + " eventos nuevos.");
        }catch(err){ alert("Ese archivo no es una copia de Agenda."); }
      };
      rd.readAsText(f);
    };
    inp.click();
  }
});
document.body.addEventListener("change", e=>{
  const m = e.target.id.match(/^s-name-([ab])$/);
  if(m){
    const p = person(m[1]), n = e.target.value.trim();
    if(n !== p.name){ Object.assign(p, {name:n, u:stamp(p)}); changed(); }
  }
  const c = catById(e.target.dataset.cat);
  if(c){
    const n = e.target.value.trim(), was = c.name;
    if(!n){ e.target.value = was; return; }
    if(n === was) return;
    renameCat(c, n);
    changed();
  }
  const sc = catById(e.target.dataset.sub);
  if(sc){
    const f = e.target.dataset.f, sid = e.target.dataset.sid, v = e.target.value.trim();
    Object.assign(sc, {subs:(sc.subs || []).map(s=>s.id === sid ? Object.assign({}, s, {[f]:v}) : s), u:stamp(sc)});
    changed();
  }
  if(e.target.id === "x-free" && X){
    const k = catById(X.cat), f = e.target.value.trim();
    if(k && f !== (k.free || "")){ Object.assign(k, {free:f, u:stamp(k)}); changed(); }
  }
});
let previewT = null;
document.body.addEventListener("input", e=>{
  e.target.classList.remove("bad");
  if((e.target.id === "f-repo" || e.target.id === "f-token") && $("f-repo-hint")) $("f-repo-hint").textContent = "";
  if(e.target.id === "x-free"){ clearTimeout(previewT); previewT = setTimeout(drawPreview, 250); }
  // keep the "whose phone" choice labelled with the names as they're typed
  const m = e.target.id.match(/^w-([ab])$/);
  if(m){
    const pill = box.querySelector(`[data-seg="me"] [data-v="${m[1]}"]`);
    if(pill) pill.textContent = e.target.value.trim() || (m[1] === "a" ? "Persona 1" : "Persona 2");
  }
});
document.body.addEventListener("keydown", e=>{
  if(e.key === "Enter" && e.target.id === "f-title"){ e.preventDefault(); saveEvent(box.querySelector('[data-act="saveEv"]').dataset.id); }
  if(e.key === "Enter" && e.target.id === "f-newcat"){ e.preventDefault(); addCatInline(); }
  // a computer keyboard: Esc closes a sheet (not the first-run one), N adds, ← → change month
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === "Escape" && L.me){ closeSheet(); return; }
  if(sheet.classList.contains("on") || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key === "n" || e.key === "N"){ e.preventDefault(); eventSheet(null, L.tab === "month" ? selDay : today()); }
  else if(L.tab === "month" && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    month = addMonths(month, e.key === "ArrowLeft" ? -1 : 1); selDay = ""; render();
  }
});

// swipe the month grid sideways to change month
let touchX = 0, touchY = 0;
view.addEventListener("touchstart", e=>{ touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }, {passive:true});
view.addEventListener("touchend", e=>{
  if(L.tab !== "month" || !e.target.closest(".grid")) return;
  const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
  if(Math.abs(dx) > 60 && Math.abs(dy) < 50){ month = addMonths(month, dx < 0 ? 1 : -1); selDay = ""; render(); }
});

// pick up the other phone's changes whenever this one is looked at
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){ render(); sync(); }
});
window.addEventListener("online", ()=>sync());
// the widget's + opens index.html#new; when the app is already open that's only a hash change
window.addEventListener("hashchange", ()=>{
  if(location.hash !== "#new") return;
  history.replaceState(null, "", location.pathname + location.search);
  if(L.me) eventSheet(null, today());
});
setInterval(()=>{
  if(document.visibilityState !== "visible") return;
  render();            // moves "today" past midnight and greys out what's over
  sync();
}, 60000);

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- service worker: offline + installable ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- boot ---------- */
(function(){
  const saved = readJSON(DOC_KEY);
  if(saved) S = normalize(saved);
  L = Object.assign(L, readJSON(LOCAL_KEY) || {});
  // a link from "Set up other phone": take the connection, then drop it from the address bar
  const join = location.hash.match(/^#join=(.+)$/);
  if(join){
    try{
      const j = JSON.parse(b64d(decodeURIComponent(join[1])));
      if(j.repo && j.token){ L.repo = j.repo; L.token = j.token; saveLocal(); }
    }catch(e){}
    history.replaceState(null, "", location.pathname + location.search);
  }
  if(spanishSeeds()){ edits++; L.dirty = true; saveDoc(); }
  if(!L.es){ L.lang = "es"; L.es = 1; }   // exports were in English before; now Spanish
  saveLocal();
  // long-press the home screen icon → "Nuevo evento"
  const quick = location.hash === "#new";
  if(quick) history.replaceState(null, "", location.pathname + location.search);
  render();
  if(quick && L.me) eventSheet(null, today());
  const ask = () => { if(!L.me) welcomeSheet(); };
  if(L.repo && L.token) sync().then(ask); else ask();
})();
</script>
